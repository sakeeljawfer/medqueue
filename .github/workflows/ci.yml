name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  integration:
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: medqueue
          POSTGRES_PASSWORD: medqueue_dev
          POSTGRES_DB: medqueue_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U medqueue"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api test:integration
        env:
          DATABASE_URL: postgresql://medqueue:medqueue_dev@localhost:5432/medqueue_test?schema=public
          REDIS_URL: redis://localhost:6379

  docker-scan:
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t medqueue-api:${{ github.sha }} .
      - name: Build Web image
        run: docker build -f apps/web/Dockerfile -t medqueue-web:${{ github.sha }} .
      - name: Trivy scan (API)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: medqueue-api:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
      - name: Trivy scan (Web)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: medqueue-web:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
